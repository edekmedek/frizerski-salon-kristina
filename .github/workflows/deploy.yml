name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}

      - name: Prepare and retain price archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cjenik-arhiva"
          if git ls-remote --exit-code origin refs/heads/cjenik-arhiva > /dev/null; then
            git fetch origin refs/heads/cjenik-arhiva
            git worktree add --detach "$archive" FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git worktree add --detach "$archive" HEAD
            git -C "$archive" switch --orphan cjenik-arhiva
          fi
          node --experimental-strip-types scripts/price-archive.mjs "$archive/price-lists" dist
          git -C "$archive" add --all
          if ! git -C "$archive" diff --cached --quiet; then
            git -C "$archive" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Archive published price list"
            git -C "$archive" push origin HEAD:refs/heads/cjenik-arhiva
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
